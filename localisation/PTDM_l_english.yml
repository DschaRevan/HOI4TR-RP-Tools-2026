 PTDM_peacetime_doctrine_studies:0 "Peacetime Military Studies"
 PTDM_peacetime_doctrine_studies_desc:0 "With the country at peace, the armed forces can devote more time to education, doctrine development and institutional learning. Grants +30 Doctrine Mastery to every active doctrine track each month, and increases Army, Navy and Air Experience gain by 25%. This spirit is removed while at war."
